# N-Ways Addressing for Burkina Faso: the registry server API (OpenAPI 3.1).
# Every example is a response of the server on the complete registry; docs/api.md shows the same calls.
openapi: "3.1.0"
info:
  title: "N-Ways Addressing for Burkina Faso: registry server"
  version: "1"
  description: "Serves the published registry of Burkina Faso (registry/) and, on the deployment designated as the issuer, issues codes by the issuer's rules. Every example is a real response (docs/api.md); long lists are cut to their first three items."
  license:
    name: "Apache-2.0 (code); ODbL-1.0 (data)"
    identifier: "Apache-2.0"
  contact:
    name: "N-WAYS LIMITED"
    email: "hello@nways.ng"
    url: "https://github.com/n-ways/open-addresses-burkina-faso"
servers:
  - url: "http://localhost:8080"
paths:
  "/v1/health":
    get:
      summary: "Liveness and registry"
      operationId: "health"
      responses:
        "200":
          description: "HTTP 200"
          content:
            "application/json":
              examples:
                health:
                  value: {"status": "ok", "country": "BF", "codes": 8369987, "registryExported": "2026-10-21T20:22:57Z", "changedSinceImport": false, "issuing": true}
              schema:
                "$ref": "#/components/schemas/Health"
        default:
          description: "Any other error (405 wrong method, 413 body too large, 500 server fault)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/v1/info":
    get:
      summary: "Country, counts, licences, engine"
      operationId: "info"
      responses:
        "200":
          description: "HTTP 200"
          content:
            "application/json":
              examples:
                info:
                  value: {"country": "BF", "name": "Burkina Faso", "api": "1", "engine": "internal/addressing/bf (SPEC v1.0)", "spec": "SPEC v1.0", "registryExported": "2026-10-21T20:22:57Z", "importedAt": "2026-10-21T20:49:57Z", "counts": {"codes": 8369987, "byStatus": {"provisional": 8369987}, "zones": 351, "communes": 351, "areas": 17518, "numberedAreas": 17319, "names": 12344}, "zones": [{"key": "10000", "name": "Ouagadougou", "codes": 755775}, {"key": "10200", "name": "Saaba", "codes": 125626}, {"key": "10250", "name": "Tanguen-Dassouri", "codes": 48387}], "licences": {"data": "ODbL-1.0", "code": "Apache-2.0", "documents": "CC-BY-4.0"}, "credit": "N-Ways Addressing for Burkina Faso, © N-WAYS LIMITED (nways.ng)", "creditUrl": "https://github.com/n-ways/open-addresses-burkina-faso", "issuing": true, "issuePerDay": 5, "forms": {"remembered": "Koulouba 17 76", "machine": "BF-10000-V064-1776-9", "spot": "BF-10000 E1809 N1351", "official": "Rue du Baobab, Bobo-Dioulasso"}}
              schema:
                "$ref": "#/components/schemas/Info"
        default:
          description: "Any other error (405 wrong method, 413 body too large, 500 server fault)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/v1/codes/{machine}":
    get:
      summary: "The card of an issued code"
      operationId: "getCode"
      parameters:
        - name: "machine"
          in: "path"
          required: true
          description: "machine form, BF-<postcode>-V<area>-<number>-<check>"
          schema:
            type: "string"
            pattern: "^BF-\\d{5}-V\\d{3}-[1-9]\\d{2,4}(-\\d)?$"
      responses:
        "200":
          description: "HTTP 200"
          content:
            "application/json":
              examples:
                code:
                  value: {"machine": "BF-10000-V064-1776-9", "remembered": "Koulouba 17 76", "home": "Koulouba 1776", "spoken": "Koulouba, 17 76", "spokenFr": "Koulouba, dix-sept soixante-seize", "plateName": "Koulouba", "officialName": "Koulouba", "number": 1776, "check": 9, "status": "provisional", "issued": "bulk", "issuedAt": "2026-10-20T22:50:53Z", "officialAddress": "Avenue Uemoa, Ouagadougou", "place": "Ouagadougou", "entrance": {"lat": 12.3641615, "lng": -1.5166371, "kind": "centre"}, "spotCode": "BF-10000 E1885 N1262", "plusCode": "7C4W9F7M+M89", "area": {"key": "10000-064", "id": 64, "index": "064", "plateName": "Koulouba", "officialName": "Koulouba", "nameProvisional": false, "commune": {"postcode": "10000", "name": "Ouagadougou"}, "nameKey": "KULUBA", "nameId": 5572, "digits": 4, "blocks": [[1000, 6369]], "numbered": true, "compoundsAtIssue": 2683, "travelAdvisory": true, "point": {"lat": 12.36702, "lng": -1.51111}, "frame": [-1.519638, 12.357614, -1.502982]}, "zone": {"key": "10000", "name": "Ouagadougou"}, "building": {"class": "hospitality", "use": "mixed", "kind": "compound", "structures": 3, "floorAreaM2": 1216.9, "rule": "annex", "estate": null}, "registry": {"machine": "BF-10000-V064-1776-9", "home": "Koulouba 1776", "written": "Koulouba 17 76", "zone": "10000-064", "official_name": "Koulouba", "number": "1776", "check": "9", "status": "provisional", "issued": "bulk", "issued_at": "2026-10-20T22:50:53Z", "entrance_lat": "12.3641615", "entrance_lng": "-1.5166371", "entrance_kind": "centre", "spot_code": "BF-10000 E1885 N1262", "official_address": "Avenue Uemoa, Ouagadougou", "class": "hospitality", "use": "mixed", "kind": "compound", "structures": "3", "floor_area_m2": "1216.9", "rule": "annex", "estate": ""}, "credit": "N-Ways Addressing for Burkina Faso, © N-WAYS LIMITED (nways.ng)"}
              schema:
                "$ref": "#/components/schemas/Card"
        "400":
          description: "HTTP 400"
          content:
            "application/json":
              examples:
                code-check:
                  value: {"error": {"code": "check_digit", "message": "The check digit does not match: a digit is wrong or two are swapped."}}
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "HTTP 404"
          content:
            "application/json":
              examples:
                code-free:
                  value: {"error": {"code": "not_issued", "message": "No compound has Koulouba 36 83 yet (BF-10000-V064-3683-5): the number is in the range of Koulouba, Ouagadougou."}}
              schema:
                "$ref": "#/components/schemas/Error"
        default:
          description: "Any other error (405 wrong method, 413 body too large, 500 server fault)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
    patch:
      summary: "Set the status or move the entrance"
      operationId: "changeCode"
      description: "An entrance moves at most 80 m, to a point in Burkina Faso as for issuing (a gap between commune outlines included); never more than 300 m outside the national border (422 `outside`)."
