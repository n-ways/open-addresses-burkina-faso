  "/v1/at":
    get:
      summary: "The code of the compound at a point"
      operationId: "at"
      description: "found when a live code's entrance is within 12 m, else none. A point in no commune outline (a gap between two outlines) is in Burkina Faso when it has a spot code (SPEC 5.1); its area is the area a new code there would take and zone that area's commune. 404 outside for a point with no code within 12 m and no commune within 10 km, or more than 300 m outside the national border (SPEC 1b); a published code is always found at its entrance."
      parameters:
        - name: "lat"
          in: "query"
          required: true
          description: "latitude, WGS 84 degrees"
          schema:
            type: "number"
            minimum: -90
            maximum: 90
        - name: "lng"
          in: "query"
          required: true
          description: "longitude, WGS 84 degrees"
          schema:
            type: "number"
            minimum: -180
            maximum: 180
