      type: "http"
      scheme: "bearer"
      description: "one of ISSUE_KEYS"
  schemas:
    Error:
      type: "object"
      required: ["error"]
      properties:
        error:
          type: "object"
          required: ["code", "message"]
          properties:
            code:
              type: "string"
            message:
              type: "string"
            existing:
              "$ref": "#/components/schemas/Card"
            point:
              type: "object"
              properties:
                lat:
                  type: "number"
                lng:
                  type: "number"
    RegistryRow:
      type: "object"
      description: "A row of registry/<postcode>.csv.gz, every column as published (text)."
      properties:
        machine:
          type: "string"
        home:
          type: "string"
        written:
          type: "string"
        zone:
          type: "string"
        official_name:
          type: "string"
        number:
          type: "string"
        check:
          type: "string"
        status:
          type: "string"
        issued:
          type: "string"
        issued_at:
          type: "string"
        entrance_lat:
          type: "string"
        entrance_lng:
          type: "string"
        entrance_kind:
          type: "string"
        spot_code:
          type: "string"
        official_address:
          type: "string"
        class:
          type: "string"
        use:
          type: "string"
        kind:
          type: "string"
        structures:
          type: "string"
        floor_area_m2:
          type: "string"
        rule:
          type: "string"
        estate:
