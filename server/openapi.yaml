  "/v1/codes":
    post:
      summary: "Issue a code for a new compound or another door"
      operationId: "issueCode"
      description: "Only on the deployment designated as the issuer. 429 `rate_limited` when the key has issued ISSUE_PER_DAY codes in 24 hours. A point in no commune outline that has a spot code (a gap between two outlines, SPEC 5.1) is in Burkina Faso and is issued like any other; 422 `outside` for a point with no commune within 10 km, and for any point more than 300 m outside the national border (OpenStreetMap admin_level 2, SPEC 1b), whatever commune outline or spot frame holds it."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/IssueRequest"
